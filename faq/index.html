    <script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "How much does a website cost?", "acceptedAnswer": {"@type": "Answer", "text": "Landing pages start at $250, multi-page websites at $500 and web apps at $1,000. Domain and hosting is $100 a month. After a free 30-minute call you get a fixed quote, so you know the exact price before any work starts."}}, {"@type": "Question", "name": "How long does it take to build a website?", "acceptedAnswer": {"@type": "Answer", "text": "Up to two weeks, and about one week for most services. A landing page is usually done in about a week, and larger websites and web apps take up to two. The biggest factor is how quickly we get your content, like text, photos and logos, so having those ready speeds things up."}}, {"@type": "Question", "name": "How do payments work?", "acceptedAnswer": {"@type": "Answer", "text": "You pay at the end. There’s nothing to pay up front: once the work is finished and you’re happy with it, you pay the agreed price. Domain and hosting is billed monthly. Prices are in US dollars, before tax."}}, {"@type": "Question", "name": "Will the price change once we’ve started?", "acceptedAnswer": {"@type": "Answer", "text": "No. Your quote is fixed. The price only changes if the scope does, for example if you decide to add pages or features partway through, and we’ll always agree that with you before doing the extra work."}}, {"@type": "Question", "name": "Do I own my website?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. You own everything we make for you: the design, the code, the content and the domain name. If you ever want to move to another host or designer, you can take it all with you."}}, {"@type": "Question", "name": "Can I update the website myself?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Websites come with an easy editor for your text, photos and pages, so you can make everyday changes without touching code and without calling us. We’ll show you how it works before launch."}}, {"@type": "Question", "name": "What does domain and hosting include?", "acceptedAnswer": {"@type": "Answer", "text": "For $100 a month we register and renew your domain, host your site on fast, reliable servers, keep its HTTPS security certificate active, set up your DNS and email forwarding, monitor it and keep backups, and make small updates and fixes each month."}}, {"@type": "Question", "name": "I already have a domain name. Can I keep it?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. We can point the domain you already own at your new site, wherever it was bought, so your web address stays the same."}}, {"@type": "Question", "name": "Will my website work on phones?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Every site is designed and tested for phones, tablets and computers. Most visitors arrive on a phone, so we make sure it looks and works best there."}}, {"@type": "Question", "name": "Will my website show up on Google?", "acceptedAnswer": {"@type": "Answer", "text": "Every site is built with the search basics in place: fast pages, clear titles and descriptions, a sitemap and business details Google can read. We can also help you set up Google Business Profile and Search Console. No one can honestly guarantee the top spot, but we give your site the best start."}}, {"@type": "Question", "name": "Can you redesign my existing website?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. We can rebuild an old or slow site from the ground up, keep the content that works, and set up redirects so your existing links and search rankings carry over."}}, {"@type": "Question", "name": "Do you only work with businesses in Greencastle?", "acceptedAnswer": {"@type": "Answer", "text": "We’re based in Greencastle, PA and work with businesses across Franklin County and south central PA, including Chambersburg, Waynesboro, Mercersburg and Hagerstown, MD. Most of the work can be done remotely too, so we can help wherever you are."}}, {"@type": "Question", "name": "Do you offer tech support as well as websites?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. We also help with computer problems like sign-in and password errors, set up new computers, and install Linux, with written instructions so you can look after it yourself afterwards."}}, {"@type": "Question", "name": "What happens after my website launches?", "acceptedAnswer": {"@type": "Answer", "text": "Websites include 30 days of fixes after launch. After that, our domain and hosting service covers monitoring, backups and small monthly updates, or you can come to us any time for bigger changes."}}, {"@type": "Question", "name": "How do I get started?", "acceptedAnswer": {"@type": "Answer", "text": "Call or text 717 494 3284. We’ll have a free 30-minute chat about what you need, then send you a fixed quote. Once you’re happy with it, we get started."}}]}</script>
